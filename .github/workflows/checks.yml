name: Checks

on:
  workflow_call:

jobs:
  check:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      # Report all four results, not just the first failure.
      fail-fast: false
      matrix:
        check: [format, lint, typecheck, test]
    steps:
      - uses: ./.github/actions/setup
      - parallel:
        - name: format
          run: pnpm run format
        - name: lint
          run: pnpm run lint
        - name: typecheck
          run: pnpm run typecheck
        - name: test
          run: pnpm run test --reporter=default --reporter=github-actions
          env:
            DATABASE_URL: postgres://ci:ci@localhost:5432/ci
