name: Production

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  deploy:
    name: Deploy Production
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    environment:
      name: Production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Derived at run time so it never drifts from a rotated Neon password.
      - name: Resolve production database URL
        id: db
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          direct=$(pnpm exec neonctl connection-string \
            "${{ vars.NEON_PRODUCTION_BRANCH }}" \
            --project-id "${{ vars.NEON_PROJECT_ID }}" \
            --database-name "${{ vars.NEON_DATABASE_NAME }}" \
            --role-name "${{ vars.NEON_ROLE_NAME }}")
          echo "::add-mask::$direct"
          echo "url=$direct" >> "$GITHUB_OUTPUT"

      # Unpooled endpoint — safer for DDL through pgbouncer.
      - name: Migrate production database
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
        run: pnpm run db:migrate

      # `vercel deploy` runs the build remotely, where Production env vars
      # (Sensitive ones included) are already configured — no `--env` needed.
      - name: Deploy production
        id: deploy
        run: |
          set -euo pipefail
          pnpm exec vercel deploy \
            --yes --archive=tgz --prod --json \
            > deployment.json || { cat deployment.json; exit 1; }
          echo "url=$(jq -r '.deployment.url // .url' deployment.json)" >> "$GITHUB_OUTPUT"
