name: Production

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  deploy:
    name: Deploy Production
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    environment:
      name: Production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      # Already attached to `main` — no `ref:` needed.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Derived from the Neon API at run time, not a stored secret — this
      # avoids drift if the Neon password rotates. Only needed for the
      # migration step below: the deploy step no longer needs a connection
      # string at all (see the Deploy production step).
      - name: Resolve production database URL
        id: db
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          direct=$(pnpm exec neonctl connection-string \
            "${{ vars.NEON_PRODUCTION_BRANCH }}" \
            --project-id "${{ vars.NEON_PROJECT_ID }}" \
            --database-name "${{ vars.NEON_DATABASE_NAME }}" \
            --role-name "${{ vars.NEON_ROLE_NAME }}")
          echo "::add-mask::$direct"
          echo "url=$direct" >> "$GITHUB_OUTPUT"

      # DDL over the direct (unpooled) endpoint — unpooled is safer through
      # pgbouncer, same reasoning as the preview job's migration step.
      - name: Migrate production database
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
        run: pnpm run db:migrate

      # No `vc build`/`--prebuilt`, no `--env`: Vercel's own infrastructure
      # runs `next build` remotely and already has correctly configured
      # Production env vars (including Marketplace-synced Sensitive ones,
      # which a CI-runner build could never read). No `--skip-domain` — we
      # want automatic promotion/aliasing.
      - name: Deploy production
        id: deploy
        run: |
          set -euo pipefail
          pnpm exec vercel deploy \
            --yes --archive=tgz --prod --json \
            > deployment.json || { cat deployment.json; exit 1; }
          echo "url=$(jq -r '.deployment.url // .url' deployment.json)" >> "$GITHUB_OUTPUT"
