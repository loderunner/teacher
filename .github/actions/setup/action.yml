name: Setup
description: Check out the repo, install pnpm and Node.js, then install dependencies from a warm store.

inputs:
  ref:
    description: Git ref to check out. Defaults to the triggering event's ref.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.ref }}
        persist-credentials: false
    # Reads `packageManager` from package.json → pnpm 11.3.0.
    - uses: pnpm/action-setup@v6
    # MUST come after pnpm: `cache: pnpm` shells out to `pnpm store path`.
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc # 24.15
        cache: pnpm
    - shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline
